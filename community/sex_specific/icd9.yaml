# community/sex_specific/icd9.yaml
#
# Sex-specific ICD-9-CM codes as a --filter_config restrictions block.
# Curated from ICD-9-CM chapter structure (CMS v32 code set): female/male
# genital neoplasms (179-184, 218-221, 233.1-233.3, 236.0-236.3 / 185-187, 222,
# 233.4-233.6, 236.4-236.6), ovarian/testicular dysfunction (256 / 257),
# male genital organs (600-608), female genital organs (614-629), pregnancy
# (630-679), genital anomalies (752.0-752.4 / 752.5-752.6, 752.81), Pap smear
# findings (795.0-795.1), pregnancy V codes (V22-V24, V27-V28, V91), plus
# explicitly sex-labelled infection, injury, history and screening codes.
# Cross-checked against the phecodeX ICD map (github.com/PheWAS/PhecodeX,
# phecodeX_R_map.csv + phecodeX_R_sex.csv): no key matches a code mapped to an
# opposite-sex phecode. A starting point, not a validated list.
#
# Globs only start with the digit block they name, so none match V or E codes
# (e.g. "61[4-9]*" cannot match V61.x). ICD-9 and phecode 1.2 numbers overlap
# (e.g. 615): run them in separate pipeline runs or give one a column_prefix.
#
# Deliberately NOT included: breast (174-175, 217, 233.0, 610-611 — men get
# breast disease), sex-chromosome conditions (758.6-758.8), 752.62 epispadias
# (occurs in both sexes), 302.76 psychogenic dyspareunia, V02.51 Group B strep
# carrier, V13.29, V25/V26 codes that apply to either partner.
#
# Usage:
#   - Copy into your filter config's `restrictions:` (merge blocks if combining
#     vocabularies), or pass this file directly as --filter_config.
#   - `level` is the LEVEL CODE from eda/eda_covariates.tsv. These assume a SEX
#     phenotype with dictionary {female: 0, male: 1}; change covariate/level to
#     match yours.
#   - Keys match OUTPUT column names (dotted codes, e.g. N80.0 / 617.1). If your
#     coded phenotype sets column_prefix (e.g. icd_), prefix every key. Bare
#     globs like "O*" also match any non-coded column starting with O.
#   - Samples outside the level are set to NA; cases among them are counted in
#     filter_log.tsv as likely miscodes.
#   - Not applied by the pipeline itself: post-processing for association tests.

