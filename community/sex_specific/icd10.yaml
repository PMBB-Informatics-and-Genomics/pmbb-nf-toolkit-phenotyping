# community/sex_specific/icd10.yaml
#
# Sex-specific ICD-10-CM codes as a --filter_config restrictions block.
# Curated from ICD-10-CM chapter structure (FY2025 code set): pregnancy
# (O00-O9A) and pregnancy encounters (Z32.0-Z3A), female/male genital organs
# (N70-N98 / N40-N53), genital neoplasms (C51-C58, D06, D07.0-D07.3, D25-D28,
# D39 / C60-C63, D07.4-D07.6, D29, D40), ovarian/testicular dysfunction (E28 /
# E29), genital malformations (Q50-Q52 / Q53-Q55), genital specimen findings
# (R87 / R86), plus explicitly sex-labelled infection, injury, history and
# screening codes. Cross-checked against the phecodeX ICD map
# (github.com/PheWAS/PhecodeX, phecodeX_R_map.csv + phecodeX_R_sex.csv): no key
# matches a code mapped to an opposite-sex phecode. A starting point, not a
# validated list.
#
# Deliberately NOT included: breast (C50, D05, N60-N65 — men get breast
# disease), sex-chromosome conditions (Q96-Q98 — karyotype can disagree with
# recorded sex), Q64.0 epispadias (occurs in both sexes), hirsutism (L68.0),
# Group B strep carrier (Z22.330), contraception/procreation codes that apply
# to either partner (Z30 except IUD/vaginal ring, Z31), Z90.79, N39.3.
# Codes whose title is sex-neutral but phecodeX calls sex-specific were not
# added; codes that phecodeX maps only to non-sex phecodes but whose title is
# anatomically sex-specific (e.g. R87, N35.0x male/female strictures, B37.3)
# were kept.
#
# Usage:
#   - Copy into your filter config's `restrictions:` (merge blocks if combining
#     vocabularies), or pass this file directly as --filter_config.
#   - `level` is the LEVEL CODE from eda/eda_covariates.tsv. These assume a SEX
#     phenotype with dictionary {female: 0, male: 1}; change covariate/level to
#     match yours.
#   - Keys match OUTPUT column names (dotted codes, e.g. N80.0 / 617.1). If your
#     coded phenotype sets column_prefix (e.g. icd_), prefix every key. Bare
#     globs like "O*" also match any non-coded column starting with O.
#   - Samples outside the level are set to NA; cases among them are counted in
#     filter_log.tsv as likely miscodes.
#   - Not applied by the pipeline itself: post-processing for association tests.

