# community/sex_specific/phecode12.yaml
#
# Sex-specific phecode 1.2 codes as a --filter_config restrictions block, derived
# exactly from the `sex_restriction` table shipped with the PheWAS R package
# (github.com/PheWAS/PheWAS, data/sex_restriction) — 119 female_only and 34 male_only
# of 1817 phecode 1.2 codes (110 / 33 here, after removing breast).
# Globs were compressed only where, expanded against every code in that
# file, they match exactly the sex-specific set (verified programmatically).
# Copied from the source EXCEPT breast phecodes it marks sex-specific, which
# are left out because men get breast disease (174.1x / 174.2 breast cancer,
# 175, 610.x) — consistent with the ICD lists. Kept: 676 (breast / lactation
# disorders of childbirth, a pregnancy complication).
# ICD-9 and phecode 1.2 numbers overlap (e.g. 615): run them in separate
# pipeline runs or give one of them a column_prefix.
#
# Usage:
#   - Copy into your filter config's `restrictions:` (merge blocks if combining
#     vocabularies), or pass this file directly as --filter_config.
#   - `level` is the LEVEL CODE from eda/eda_covariates.tsv. These assume a SEX
#     phenotype with dictionary {female: 0, male: 1}; change covariate/level to
#     match yours.
#   - Keys match OUTPUT column names. If your coded phenotype sets
#     column_prefix (e.g. phe_), prefix every key.
#   - Samples outside the level are set to NA; cases among them are counted in
#     filter_log.tsv as likely miscodes.
#   - Not applied by the pipeline itself: post-processing for association tests.

restrictions:
  # ── Female (SEX level "0") ──────────────────────────────────────────────────
